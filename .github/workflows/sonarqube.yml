name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: [self-hosted, windows, sonarqube]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install scanner
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        shell: pwsh
        run: >
          dotnet sonarscanner begin /k:"GeekShop" /n:"GeekShop"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.qualitygate.wait=true
          /s:"${{ github.workspace }}\SonarQube.Analysis.xml"

      - name: Build
        shell: pwsh
        run: dotnet build GeekShop.slnx --no-incremental

      - name: Test with coverage
        shell: pwsh
        run: |
          foreach ($p in "tests/GeekShop.Api.Tests", "tests/GeekShop.Api.IntegrationTests") {
            dotnet test --project $p --coverlet --coverlet-output-format cobertura `
              --coverlet-exclude-by-file "**/*.g.cs" "**/obj/**" `
              --coverlet-exclude-by-attribute GeneratedCode CompilerGenerated `
              --results-directory "${{ github.workspace }}/artifacts/sonar/coverage"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: End analysis (fails the job if the quality gate fails)
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
