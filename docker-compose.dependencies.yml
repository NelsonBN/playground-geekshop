networks:
  geekshop:
    driver: bridge

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: geekshop-sqlserver
    environment:
      MSSQL_PID: Developer
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - 1433:1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - geekshop
    healthcheck:
      test: >
        /bin/bash -c "echo > /dev/tcp/localhost/1433"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    container_name: geekshop-mssqltools
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    volumes:
      - ./tests/init-db.sql:/tmp/init-db.sql:ro
      - ./tests/init-db.sh:/tmp/init-db.sh:ro
    command: /bin/bash /tmp/init-db.sh
    networks:
      - geekshop
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: geekshop-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - 5672:5672   # messaging (AMQP)
      - 15672:15672 # management UI
    networks:
      - geekshop
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 3s
      retries: 5

volumes:
  sqlserver-data:
